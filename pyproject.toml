[project]
name = "xenocomm"
version = "0.1.0"
description = "Bayesian variational inference for cross-species cell-cell communication in xenograft data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "anndata>=0.10.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0,<2.4",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scanpy>=1.9.0",
    "seaborn>=0.13.0",
    "scipy>=1.10.0",
    "tensorflow>=2.20,<2.21",
    "tensorflow-probability[tf]>=0.25,<0.26",
]

[project.optional-dependencies]
comparison = [
    "anndata==0.12.7",
    "pandas>=2.2,<3",
    "scanpy==1.11.5",
    "liana==1.7.3",
    "rpy2==3.6.4",
    "rpy2-rinterface==3.6.3",
    "rpy2-robjects==3.6.3",
    "anndata2ri==2.0",
]
gpu = [
    "tensorflow[and-cuda]>=2.20,<2.21",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["notebooks/*.ipynb", "scripts/install_cellchat.R"]
